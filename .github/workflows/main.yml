name: Prompt Hub CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1️⃣ Build job (CI)
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm test || echo "No tests found, skipping"

      - name: Build project
        run: npm run build --if-present

      # ✅ Upload build artifacts with a unique name per matrix job
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.node-version }}-${{ github.run_id }}
          path: dist

  # 2️⃣ Deploy job (CD)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: prompt-hub

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Optional: Download the artifact if your deploy needs it
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: build-20.x-${{ github.run_id }}  # pick one version to deploy
          path: dist

      - name: Deploy to Render
        if: github.ref == 'refs/heads/main'
        run: |
          curl -X POST "https://api.render.com/deploy/srv-d4m8nakhg0os73bmgsi0?key=PM8ZTpxYsJY"
