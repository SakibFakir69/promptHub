name: Prompt Hub CI/CD

on:
  push:
    branches: [ "main" ]   # Only deploy on main branch push
  # Optional: remove PR trigger if you don't want auto deploy for PRs
  pull_request:
    branches: [ "main" ]

jobs:
  # 1️⃣ Build job (CI)
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm test || echo "No tests found, skipping"

      - name: Build project
        run: npm run build --if-present

      # ✅ Upload build artifact (single artifact, not matrix specific)
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist

  # 2️⃣ Deploy job (CD)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: prompt-hub
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'  # Only deploy on main push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build
          path: dist

      - name: Deploy to Render
        run: |
          set -e   # Exit if curl fails
          curl -X POST "https://api.render.com/deploy/srv-d4m8nakhg0os73bmgsi0?key=PM8ZTpxYsJY"
